name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' --dart-define=SUPABASE_ANON_KEY='${{ secrets.SUPABASE_ANON_KEY }}' --dart-define=APP_TIME_ZONE='Europe/Madrid'
      - run: sha256sum build/app/outputs/flutter-apk/app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nidoconecta-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            app-release.apk.sha256
